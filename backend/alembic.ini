# Present from commit one. V1 shipped an env.py that called fileConfig() while
# alembic.ini did not exist, so its documented `alembic upgrade head` could
# never actually run.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
timezone = UTC
# sqlalchemy.url is intentionally absent: env.py reads it from app.core.config
# so the V1-isolation guard applies to migrations too.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
