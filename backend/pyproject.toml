[project]
name = "prajna-backend"
version = "0.1.0"
description = "AutoTrade Pro V2 — Upstox-only, provenance-bearing market data ingestion"
requires-python = ">=3.11"

# Deliberately small. This is an ingestion service: no tensorflow, no torch,
# no transformers. V1's requirements.txt carried 200+ packages into every
# process; that is a large part of why its workers needed 1.5 GB each.
dependencies = [
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "websockets>=14.0",
  "protobuf>=5.29",
  "typer>=0.15",
  "structlog>=24.4",
  "tenacity>=9.0",
  "pandas-market-calendars>=4.6",
  "pyotp>=2.9",
  "python-dotenv>=1.0",
  # Upstox TOTP login (app/vendor/upstox/auth.py) needs browser TLS impersonation.
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "grpcio-tools>=1.68",
  "ruff>=0.9",
]

[project.scripts]
prajna = "app.cli.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ── pytest ──────────────────────────────────────────────────────────────────
# --strict-markers WITH real markers. V1 had --strict-markers and zero markers,
# so its DB/network tests could not be deselected: it was all-or-nothing.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -p no:cacheprovider"
markers = [
  "live: hits real external APIs; deselected by default, opt in with -m live",
  "db: requires the test database",
  "integration: multi-component",
  "slow: long-running",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
